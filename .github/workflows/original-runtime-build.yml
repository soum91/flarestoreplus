name: Build original FlareStorePlus Library UI extension

on:
  push:
    branches: [main]
    paths:
      - 'patches/original_runtime/**'
      - '.github/workflows/original-runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS extension (no user IPA uploaded)
        run: |
          mkdir -p output
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc \
            -dynamiclib -Wl,-install_name,@executable_path/Frameworks/FlareStorePlusRuntime.dylib \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            patches/original_runtime/FlareStorePlusRuntime.m \
            -o output/FlareStorePlusRuntime.dylib
          file output/FlareStorePlusRuntime.dylib
          xcrun otool -L output/FlareStorePlusRuntime.dylib
          codesign --force --sign - output/FlareStorePlusRuntime.dylib
      - name: Publish extension as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: original-flarestoreplus-runtime
          path: output/FlareStorePlusRuntime.dylib
          if-no-files-found: error
