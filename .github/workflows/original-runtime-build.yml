name: Build original FlareStorePlus Library UI extension

on:
  push:
    branches: [main]
    paths:
      - 'patches/original_runtime/**'
      - '.github/workflows/original-runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS extension (no user IPA uploaded)
        run: |
          mkdir -p output
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc \
            -dynamiclib -Wl,-install_name,@executable_path/Frameworks/FlareStorePlusRuntime.dylib \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            patches/original_runtime/FlareStorePlusRuntime.m \
            -o output/FlareStorePlusRuntime.dylib
          file output/FlareStorePlusRuntime.dylib
          xcrun otool -L output/FlareStorePlusRuntime.dylib
          codesign --force --sign - output/FlareStorePlusRuntime.dylib
      - name: Publish extension as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: original-flarestoreplus-runtime
          path: output/FlareStorePlusRuntime.dylib
          if-no-files-found: error

      - name: Store compiled b59 runtime as text for private IPA packaging
        run: |
          set -euo pipefail
          mkdir -p compiled
          base64 -i output/FlareStorePlusRuntime.dylib | tr -d '\n' > compiled/original-runtime-b60.b64
          shasum -a 256 output/FlareStorePlusRuntime.dylib > compiled/original-runtime-b60.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiled/original-runtime-b60.b64 compiled/original-runtime-b60.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(original): compile arm64 b60 runtime [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -ne 3 || exit 1
          done
